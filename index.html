<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوكلت الصف الثاني – مراجعة نهاية الفصل الأول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#2b2b3a;--mut:#6b6b80;--ok:#2f9e44;--bad:#e03131;--line:#e9e3f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2745;--ink:#f4f1ff;--mut:#b9b4d6;--ok:#69db7c;--bad:#ff8787;--line:#403c66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b2e;--card:#2a2745;--ink:#f4f1ff;--mut:#b9b4d6;--ok:#69db7c;--bad:#ff8787;--line:#403c66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:18px;line-height:1.9}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{text-align:center;padding:14px 12px 4px}
header h1{margin:0;font-size:26px;font-weight:900;background:linear-gradient(90deg,#ff6b6b,#ffa94d,#51cf66,#339af0,#cc5de8);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--mut);font-size:15px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;gap:10px;overflow-x:auto;padding:10px 12px;border-bottom:3px dashed var(--line)}
.tab{flex:0 0 auto;min-width:92px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 10px;cursor:pointer;font:inherit;font-weight:700;font-size:15px;line-height:1.4;display:flex;flex-direction:column;align-items:center;transition:.2s}
.tab b{font-size:30px;line-height:1.2}
.tab.on{background:var(--c);color:#fff;transform:translateY(-3px);box-shadow:0 5px 0 rgba(0,0,0,.18)}
main{max-width:820px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--card);border-radius:24px;padding:14px 16px;margin:16px 0;border:3px solid var(--c);box-shadow:0 6px 0 var(--c)}
.card h2,.card h3{margin:0 0 6px;font-size:21px;color:var(--c)}
.card h3 small{display:block;font-size:14px;color:var(--mut);direction:ltr;text-align:right;font-weight:500}
.para{font-size:24px;line-height:2.3;margin:8px 0}
.sp{border:0;border-radius:99px;background:var(--c);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:2px 12px;cursor:pointer}
.sp.s{padding:0 8px;margin-inline-start:6px}
.it{padding:8px 10px;margin:8px 0;border-radius:16px;background:rgba(127,127,160,.08);border:2px solid transparent}
.it.ok{border-color:var(--ok);background:rgba(47,158,68,.12)}.it.bad{border-color:var(--bad);background:rgba(224,49,49,.1)}.it.open{border-color:#339af0}.it.none{border-color:#fcc419}
.it p{margin:0}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ops label{cursor:pointer}.ops input{position:absolute;opacity:0}
.ops span{display:inline-block;padding:2px 14px;border:2px solid var(--c);border-radius:99px;background:var(--card)}
.ops input:checked+span{background:var(--c);color:#fff}
input.tx,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:2px 10px;width:100%}
select{width:auto;border-color:var(--c)}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.chip{border:0;border-radius:99px;background:var(--c);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:0 10px;cursor:pointer}
.fb{font-size:16px;margin-top:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.bank i{font-style:normal;background:var(--c);color:#fff;border-radius:99px;padding:0 12px;font-size:16px}
.go{display:block;width:100%;margin-top:8px;border:0;border-radius:18px;background:#ffd43b;color:#3b2f00;font:inherit;font-weight:900;font-size:18px;padding:4px;cursor:pointer;box-shadow:0 4px 0 #e0a800}
.res{font-weight:900;text-align:center;font-size:20px}
.bub{background:#fff9db;color:#3b2f00;border:2px dashed #fcc419;border-radius:16px;padding:6px 12px;margin-top:8px;font-size:17px}
.bub .en{direction:ltr;text-align:left;font-size:15px;margin-top:4px}
#toast{position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;background:#ff6b6b;color:#fff;font-weight:900;text-align:center;border-radius:20px;padding:8px;display:none;z-index:20}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.pg img{width:88px;height:88px;display:block;margin:auto}.pg .it{text-align:center}.cj{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0;text-align:center}.cj b{display:block;border-radius:12px;background:var(--c);color:#fff}.cj .it{margin:0;padding:4px}.cj input{text-align:center}.st i{font-style:normal;background:var(--c);color:#fff;border-radius:99px;padding:0 10px;font-size:16px;margin:0 3px}.en{display:block;direction:ltr;text-align:left;font-size:14px;color:var(--mut);line-height:1.4;font-weight:500}.tab .en{text-align:center;font-size:11px;color:inherit}.nx{display:flex;justify-content:space-between;gap:10px}.nx button{flex:1;border:0;border-radius:20px;padding:6px;font:inherit;font-weight:900;font-size:18px;color:#fff;background:#339af0;cursor:pointer}
</style>
</head>

const E={n:['اسم','الاسم كلمة تدل على إنسان أو حيوان أو نبات أو جماد أو مكان. علاماته: يقبل أل التعريف مثل الكتاب، ويقبل التنوين مثل كتابٌ، ويأتي بعد حرف الجر مثل: في البيت.','A noun is a word that names a person, an animal, a plant, a thing or a place. Its signs: it can take the Arabic word “al”, it can take tanween, and it can come after a preposition.'],
v:['فعل','الفعل كلمة تدل على عمل يحدث في زمن. علاماته: في المضارع يبدأ بأحد هذه الحروف: الهمزة، النون، الياء، التاء، مثل أكتب، نكتب، يكتب، تكتب. ويقبل السين مثل سأكتب.','A verb is a word that shows an action in a time. Its signs: the present verb starts with alef, noon, yaa or taa, and it can take “sa” for the future.'],
p:['حرف جر','حرف الجر كلمة صغيرة ليس لها معنى وحدها، وتأتي قبل الاسم، مثل: في، على، إلى، من، مع. علامته: لا يقبل أل ولا التنوين ولا علامات الفعل.','A preposition is a small word that comes before a noun, such as in, on, to, from and with. Its signs: it never takes “al”, tanween, or verb signs.'],
a:['صفة','الصفة كلمة تصف الاسم وتبين حاله، مثل: جميل، كبير، نظيف. علامتها: تأتي بعد الاسم وتتبعه في التذكير والتأنيث، فنقول: بيت جميل، وغرفة جميلة.','An adjective describes a noun, such as beautiful, big or clean. Its signs: it comes after the noun and agrees with it as masculine or feminine.']};
